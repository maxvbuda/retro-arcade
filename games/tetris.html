<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris — Max Arcade</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title" style="font-size:28px;">TETRIS</h1>
  </header>
  <div class="game-wrap">
    <a class="back-link" href="../index.html">&lt; BACK TO ARCADE</a>
    <div class="hud">
      <div>SCORE <span id="score">0</span></div>
      <div>LINES <span id="lines">0</span></div>
      <div>LEVEL <span id="level">1</span></div>
    </div>
    <canvas id="game" width="240" height="480"></canvas>
    <div class="overlay-msg" id="msg"></div>
    <p class="hint">LEFT/RIGHT to move &middot; UP to rotate &middot; DOWN to soft drop &middot; SPACE to hard drop &middot; P to pause &middot; R to restart</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const cell = 24;
    const cols = 10, rows = 20;

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const msgEl = document.getElementById('msg');

    const SHAPES = {
      I: { color: '#2ee8ff', cells: [[0,1],[1,1],[2,1],[3,1]] },
      O: { color: '#ffe62e', cells: [[1,0],[2,0],[1,1],[2,1]] },
      T: { color: '#c02eff', cells: [[1,0],[0,1],[1,1],[2,1]] },
      S: { color: '#2eff88', cells: [[1,0],[2,0],[0,1],[1,1]] },
      Z: { color: '#ff2e88', cells: [[0,0],[1,0],[1,1],[2,1]] },
      J: { color: '#2e6bff', cells: [[0,0],[0,1],[1,1],[2,1]] },
      L: { color: '#ff8a2e', cells: [[2,0],[0,1],[1,1],[2,1]] },
    };
    const KEYS = Object.keys(SHAPES);

    let grid, cur, score, lines, level, dropMs, dropTimer, over, paused;

    function emptyGrid() {
      return Array.from({ length: rows }, () => Array(cols).fill(null));
    }

    function newPiece() {
      const k = KEYS[Math.floor(Math.random() * KEYS.length)];
      const shape = SHAPES[k];
      return {
        color: shape.color,
        cells: shape.cells.map(([x, y]) => ({ x: x + 3, y })),
      };
    }

    function reset() {
      grid = emptyGrid();
      cur = newPiece();
      score = 0; lines = 0; level = 1;
      dropMs = 700;
      over = false; paused = false;
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
      msgEl.textContent = '';
      if (dropTimer) clearInterval(dropTimer);
      dropTimer = setInterval(drop, dropMs);
    }

    function collides(cells) {
      return cells.some(({ x, y }) =>
        x < 0 || x >= cols || y >= rows || (y >= 0 && grid[y][x]));
    }

    function lockPiece() {
      cur.cells.forEach(({ x, y }) => {
        if (y >= 0) grid[y][x] = cur.color;
      });
      clearLines();
      cur = newPiece();
      if (collides(cur.cells)) {
        over = true;
        clearInterval(dropTimer);
        msgEl.textContent = 'GAME OVER — press R to restart';
      }
    }

    function clearLines() {
      let cleared = 0;
      for (let y = rows - 1; y >= 0; y--) {
        if (grid[y].every(c => c)) {
          grid.splice(y, 1);
          grid.unshift(Array(cols).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared > 0) {
        const points = [0, 100, 300, 500, 800][cleared] * level;
        score += points;
        lines += cleared;
        level = 1 + Math.floor(lines / 10);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
        dropMs = Math.max(120, 700 - (level - 1) * 60);
        clearInterval(dropTimer);
        dropTimer = setInterval(drop, dropMs);
      }
    }

    function move(dx) {
      if (over || paused) return;
      const moved = cur.cells.map(({ x, y }) => ({ x: x + dx, y }));
      if (!collides(moved)) cur.cells = moved;
    }

    function rotate() {
      if (over || paused) return;
      const pivot = cur.cells[1] || cur.cells[0];
      const rotated = cur.cells.map(({ x, y }) => {
        const rx = pivot.x - (y - pivot.y);
        const ry = pivot.y + (x - pivot.x);
        return { x: rx, y: ry };
      });
      if (!collides(rotated)) cur.cells = rotated;
    }

    function drop() {
      if (over || paused) return;
      const moved = cur.cells.map(({ x, y }) => ({ x, y: y + 1 }));
      if (!collides(moved)) {
        cur.cells = moved;
      } else {
        lockPiece();
      }
      draw();
    }

    function hardDrop() {
      if (over || paused) return;
      while (true) {
        const moved = cur.cells.map(({ x, y }) => ({ x, y: y + 1 }));
        if (collides(moved)) break;
        cur.cells = moved;
        score += 2;
      }
      scoreEl.textContent = score;
      lockPiece();
      draw();
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x]) drawCell(x, y, grid[y][x]);
        }
      }
      cur.cells.forEach(({ x, y }) => { if (y >= 0) drawCell(x, y, cur.color); });

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      for (let x = 0; x <= cols; x++) {
        ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, rows * cell); ctx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(cols * cell, y * cell); ctx.stroke();
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 5;
      ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
      ctx.shadowBlur = 0;
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
      if (k === 'r') { reset(); draw(); return; }
      if (k === 'p') {
        if (!over) {
          paused = !paused;
          msgEl.textContent = paused ? 'PAUSED' : '';
        }
        return;
      }
      if (over || paused) return;
      if (k === 'arrowleft') move(-1);
      else if (k === 'arrowright') move(1);
      else if (k === 'arrowup') rotate();
      else if (k === 'arrowdown') drop();
      else if (k === ' ') hardDrop();
      draw();
    });

    reset();
    draw();
  </script>
</body>
</html>
